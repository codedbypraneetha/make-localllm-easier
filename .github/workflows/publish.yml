name: publish
# Releases are uploaded from the maintainer's machine with twine (API token). This workflow is kept for PyPI Trusted
# Publishing: once a trusted publisher is configured on pypi.org (owner phonology024, repo make-localllm-easier,
# workflow publish.yml, environment pypi), run it from the Actions tab. It is manual so tags don't show false failures.
on:
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
