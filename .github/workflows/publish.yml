name: publish
# PyPI Trusted Publishing (configured on pypi.org: owner phonology024, repo make-localllm-easier, workflow publish.yml,
# environment pypi). Runs on every v* tag; can also be started from the Actions tab. No API token is stored anywhere.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
